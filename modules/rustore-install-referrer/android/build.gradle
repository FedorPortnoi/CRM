plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.fedorportnoi.crm'
version = '1.0.0'

android {
  namespace 'expo.modules.rustoreinstallreferrer'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Latest artifact actually published in RuStore's official Maven metadata.
  // It contains the repeatable V2 API documented for the current SDK flow.
  implementation 'ru.rustore.sdk:installreferrer:10.6.1'
}
