# Cloudflare Tunnel — the public door for the self-hosted deployment.
#
# There is no public IP and no port forwarding here. cloudflared makes an
# OUTBOUND connection to Cloudflare and traffic comes back down it, which is why
# this works behind a home router and carrier NAT.
#
# ─────────────────────────────────────────────────────────────────────────────
# BEFORE THIS FILE WORKS (one-time, needs a browser and a Cloudflare account):
#
#   1. winget install --id Cloudflare.cloudflared
#   2. cloudflared tunnel login            ← opens a browser, pick the 4kub.ru zone
#   3. cloudflared tunnel create 4kub
#   4. cloudflared tunnel route dns 4kub 4kub.ru
#      cloudflared tunnel route dns 4kub www.4kub.ru
#   5. Put the tunnel's UUID and credentials path below.
#
# Step 4 writes the DNS record for you, so nothing needs changing by hand at
# reg.ru except moving the nameservers to Cloudflare.
# ─────────────────────────────────────────────────────────────────────────────

tunnel: 3f95c458-ffdb-405d-8d58-7e955619d132
credentials-file: C:\Users\fedor\.cloudflared\3f95c458-ffdb-405d-8d58-7e955619d132.json

# ─────────────────────────────────────────────────────────────────────────────
# TRANSPORT — http2, not the default quic, and the logs are the argument.
#
# cloudflared prefers QUIC, which is UDP on port 7844. One week of
# logs/tunnel-error-4.log:
#
#   1285  failed to run the datagram handler        ← QUIC-only machinery
#     32  Failed to dial a quic connection
#          "timeout: no recent network activity"
#     57  Connection terminated
#     20  Failed to refresh DNS local resolver
#
# "no recent network activity" on a UDP dial is the signature of a path that
# drops or ages out UDP rather than of a busy edge — a home router's NAT table,
# or an ISP that treats sustained UDP differently from TCP. Every one of those
# terminations cuts whatever was in flight, and a stylesheet cut off mid-flight
# is discarded whole by the browser: that is how 4kub.ru came to render from
# base.css alone on 2026-08-10.
#
# HTTP/2 rides ordinary TCP on 443, which is the one thing every residential
# path is built to carry well. This tunnel forwards HTTP and nothing else — no
# WARP routing, no UDP or ICMP proxying — so the QUIC-only features being given
# up here are features this deployment does not use. The datagram handler noise
# disappears with them.
#
# If the edge ever becomes unreachable over TCP, `auto` restores the old
# behaviour: cloudflared then tries QUIC first and falls back to HTTP/2 itself.
protocol: http2

# Ingress rules are evaluated TOP DOWN and the first match wins, so the API
# routes must come before the catch-all. These reproduce the nginx vhost the VM
# was running; where they differ, that is a bug rather than a decision.
ingress:
  # ── Staging hostname, used to prove the whole path before the apex is
  # touched. 4kub.ru stays on the Yandex VM while this is exercised.
  - hostname: test.4kub.ru
    path: ^/api/.*
    service: http://127.0.0.1:3000
  - hostname: test.4kub.ru
    path: ^/(health|version)$
    service: http://127.0.0.1:3000
  # Client-reported debug log intake (backend/api/routes/debug-log.ts), mounted
  # outside /api/v1 on purpose — see that file's header comment. Added
  # 2026-08-17 alongside the equivalent fix on the VPS-nginx vhost; that config
  # is the one actually in the live traffic path, this one caught up to match
  # per the file-level rule above (divergence from it is a bug, not a choice).
  - hostname: test.4kub.ru
    path: ^/debug/.*
    service: http://127.0.0.1:3000
  - hostname: test.4kub.ru
    service: http://127.0.0.1:8080

  # ── API ────────────────────────────────────────────────────────────────────
  - hostname: 4kub.ru
    path: ^/api/.*
    service: http://127.0.0.1:3000
  - hostname: www.4kub.ru
    path: ^/api/.*
    service: http://127.0.0.1:3000

  # The backend owns these two as well — they are not static files.
  - hostname: 4kub.ru
    path: ^/(health|version)$
    service: http://127.0.0.1:3000
  - hostname: www.4kub.ru
    path: ^/(health|version)$
    service: http://127.0.0.1:3000

  # See the comment on the test.4kub.ru /debug rule above.
  - hostname: 4kub.ru
    path: ^/debug/.*
    service: http://127.0.0.1:3000
  - hostname: www.4kub.ru
    path: ^/debug/.*
    service: http://127.0.0.1:3000

  # ── Everything else: the website, /i, /.well-known ────────────────────────
  - hostname: 4kub.ru
    service: http://127.0.0.1:8080
  - hostname: www.4kub.ru
    service: http://127.0.0.1:8080

  # Required terminator. Anything not matched above is refused rather than
  # silently forwarded somewhere.
  - service: http_status:404

originRequest:
  # The API is local; a long timeout only hides a hung process.
  connectTimeout: 10s
  # The assistant's model calls can be slow, and a request cut off mid-completion
  # looks to the user like the feature is broken.
  noTLSVerify: false
  httpHostHeader: 4kub.ru
