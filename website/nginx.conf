server {
    listen 80;
    listen [::]:80;
    server_name 4kub.ru www.4kub.ru;

    # Certbot will insert the SSL redirect here.
    # After running certbot --nginx it will add a 301 redirect to HTTPS
    # and create a second server block for 443.

    root /var/www/4kub;
    index index.html;

    # Proxy all API calls to the Fastify backend
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # App Link / Universal Link association files.
    #
    # Both platforms fetch these over plain HTTPS with no redirects and no
    # authentication, and both are strict about it: iOS refuses an
    # apple-app-site-association served as anything but application/json, and it
    # must have NO file extension — which is why the Content-Type is forced here
    # rather than left to nginx's extension-based mime map.
    #
    # Verifying these is what lets the invite link open the app directly instead
    # of travelling over the `crm://` custom scheme. A custom scheme is
    # first-come-first-served on Android: any installed app may claim `crm` and
    # win the intent race, which would hand an invite token to whoever squatted
    # it. An App Link is bound to the signing certificate below and cannot be
    # claimed by anyone else.
    location /.well-known/ {
        default_type application/json;
        add_header Content-Type application/json always;
        # These are public by design — they are fetched by Apple and Google
        # before the app is installed — but they should not be cached so long
        # that a fingerprint rotation takes a day to propagate.
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # Invite landing. The token rides in the URL fragment, so nginx never sees
    # it and it is absent from access_log by construction — logging is disabled
    # here anyway as a second line, in case the link is ever reshaped to carry
    # the token in the path.
    #
    # no-store keeps the page (and the claim code rendered into it) out of shared
    # proxy caches and out of the browser's back-forward cache.
    location = /i {
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /i.html =404;
    }

    # Serve HTML pages without .html extension:
    #   /register  → register.html
    #   /verify    → verify.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(css|js|ico|png|jpg|jpeg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
