# ─────────────────────────────────────────────────────────────────────────────
# ⚠ THIS FILE IS NOT IN USE AND HAS NOT BEEN SINCE 2026-08-01.
#
# `root /var/www/4kub` is a path on the Yandex VM, and that VM was deleted on
# 2026-08-03. Nothing reads this file; nothing deploys it. It is kept only as the
# record of what the vhost did, because deploy/local/static-server.js was written
# to reproduce it behaviour-for-behaviour.
#
# THE AUTHORITATIVE CONFIG IS:
#   deploy/local/static-server.js   routing, caching, conditional requests
#   deploy/local/static-headers.js  content types and every security header
#   deploy/local/cloudflared.yml    which hostnames reach which local port
#
# It is written down this loudly because a file that looks like a production
# vhost is exactly what someone reaches for when moving back behind nginx, and
# for its whole life this one set no security headers at all — that is where the
# missing CSP on 4kub.ru came from in the first place. The server-level block
# below now carries the ones that are static and safe. It deliberately carries
# NO Content-Security-Policy: the policy for this site is script-src with
# per-page sha256 hashes of four inline scripts, nginx cannot compute those, and
# a hand-copied hash going stale silently blocks the only script on
# register.html / verify.html / i.html — which IS registration, email
# verification and invite claim. Anyone reviving this file must generate the
# policy at deploy time or keep static-server.js in front of nginx.
#
# add_header NOTE: nginx does NOT inherit add_header into a location that
# declares its own. That is why the set is repeated verbatim in each location
# below instead of being written once at the top — dropping the repetition
# silently un-protects exactly those paths.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name 4kub.ru www.4kub.ru;

    # clipboard-write is deliberately absent from Permissions-Policy: i.html
    # writes the invite handoff to the clipboard, and on iOS there is no
    # install-referrer API, so the clipboard IS the channel the app reads on
    # first launch. Denying it breaks iOS invite acceptance with no error.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;

    # Certbot will insert the SSL redirect here.
    # After running certbot --nginx it will add a 301 redirect to HTTPS
    # and create a second server block for 443.

    root /var/www/4kub;
    index index.html;

    # Proxy all API calls to the Fastify backend
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # App Link / Universal Link association files.
    #
    # Both platforms fetch these over plain HTTPS with no redirects and no
    # authentication, and both are strict about it: iOS refuses an
    # apple-app-site-association served as anything but application/json, and it
    # must have NO file extension — which is why the Content-Type is forced here
    # rather than left to nginx's extension-based mime map.
    #
    # Verifying these is what lets the invite link open the app directly instead
    # of travelling over the `crm://` custom scheme. A custom scheme is
    # first-come-first-served on Android: any installed app may claim `crm` and
    # win the intent race, which would hand an invite token to whoever squatted
    # it. An App Link is bound to the signing certificate below and cannot be
    # claimed by anyone else.
    location /.well-known/ {
        default_type application/json;
        add_header Content-Type application/json always;
        # These are public by design — they are fetched by Apple and Google
        # before the app is installed — but they should not be cached so long
        # that a fingerprint rotation takes a day to propagate.
        add_header Cache-Control "public, max-age=300" always;
        # Repeated because this location declares add_header of its own, which
        # cancels inheritance of the server-level set. See the banner above.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;
        try_files $uri =404;
    }

    # Invite landing. The token rides in the URL fragment, so nginx never sees
    # it and it is absent from access_log by construction — logging is disabled
    # here anyway as a second line, in case the link is ever reshaped to carry
    # the token in the path.
    #
    # no-store keeps the page (and the claim code rendered into it) out of shared
    # proxy caches and out of the browser's back-forward cache.
    location = /i {
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        # Stricter than the server-level default on purpose, and it must stay
        # that way — this is the one page that renders a live claim code.
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # Repeated: this location's own add_header cancels inheritance.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;
        try_files /i.html =404;
    }

    # Serve HTML pages without .html extension:
    #   /register  → register.html
    #   /verify    → verify.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(css|js|ico|png|jpg|jpeg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Repeated: this location's own add_header cancels inheritance. nosniff
        # matters most here — this is where a wrong Content-Type would be
        # sniffed into something executable.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;
    }
}
